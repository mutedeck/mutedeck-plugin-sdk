components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        64-character token from POST /v1/pair or MuteDeck Settings > Plugins &
        API. Optional unless MuteDeck is set to require it.
  parameters:
    sourceParam:
      in: query
      name: source
      schema:
        type: string
      required: false
      description: >-
        Identifier of the client sending this request (e.g. raycast,
        loupedeck, streamdeck), used for anonymous usage statistics.
        Optional; unknown values are normalized to a lowercase slug.
  schemas:
    MeetingStatus:
      type: object
      properties:
        call:
          type: string
          description: Whether or not a call is active
          enum:
            - active
          example: active
        control:
          type: string
          description: System that's controlling the microphone, camera, etc.
          enum:
            - system
            - zoom
            - webex
            - teams
            - google-meet
          example: zoom
        mute:
          type: string
          description: Status of muting (active = muted)
          enum:
            - active
            - inactive
          example: active
        record:
          type: string
          description: Status of recording (disabled = no call)
          enum:
            - active
            - inactive
            - disabled
          example: active
        share:
          type: string
          description: Status of screen sharing (disabled = no call)
          enum:
            - active
            - inactive
            - disabled
          example: inactive
        status:
          type: integer
          description: Status of API call
          enum:
            - 200
          example: 200
        version:
          type: string
          description: MuteDeck application version
          example: "4.6"
        video:
          type: string
          description: Status of camera (disabled = no call)
          enum:
            - active
            - inactive
            - disabled
          example: active

    CustomActionList:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: Status of API call
          enum:
            - 200
            - 400
        custom_actions:
          type: array
          items:
            $ref: '#/components/schemas/CustomActionDetails'

    CustomActionDetails:
      type: object
      properties:
        name:
          type: string
          description: The name of the custom action, which is used to trigger it
          example: zoom-hands-up
        shortcut:
          type: string
          description: Key shortcut that's sent to application. Empty string for built-in actions.
          example: Alt+Y
        application:
          type: string
          description: The conference call application this custom action is for
          enum:
            - zoom
            - teams
            - google-meet
            - webex
            - discord
            - active-application
          example: zoom
        app_types:
          type: array
          description: List of all application types this action is available for
          items:
            type: string
          example: ["zoom", "teams"]
        type:
          type: string
          description: Whether this is a user-defined custom action or a built-in action
          enum:
            - custom
            - builtin
          example: custom

    AuthError:
      type: object
      description: >-
        Sent with a real HTTP status (401, 404, 426 or 429) when a request is
        refused before it runs: an unknown token, a missing token where one is
        required, or pairing errors.
      properties:
        status:
          type: integer
          example: 401
        reason:
          type: string
          enum:
            - not_authenticated
            - upgrade_required
            - bad_request
            - not_found
            - rate_limited
        message:
          type: string
        retry_after:
          type: integer
          description: Seconds
    PairRequest:
      type: object
      required:
        - client
        - instance_id
      properties:
        client:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              pattern: '^[a-z0-9-]{1,32}$'
            name:
              type: string
              maxLength: 64
            version:
              type: string
            host_app:
              type: string
            host_version:
              type: string
            os:
              type: string
              enum:
                - mac
                - windows
                - linux
        instance_id:
          type: string
          pattern: '^[A-Za-z0-9-]{8,64}$'
          description: Generated once per install and kept with the token.
    PairPending:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
        request_id:
          type: string
        poll_after:
          type: integer
          description: Seconds to wait before the next poll
        expires_in:
          type: integer
          description: Seconds until the request expires
    PairApproved:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
        token:
          type: string
    PairDenied:
      type: object
      properties:
        status:
          type: string
          enum:
            - denied
        reason:
          type: string
          enum:
            - user
            - expired
            - busy
        retry_after:
          type: integer
          description: Seconds before asking again
    WhoAmI:
      type: object
      properties:
        status:
          type: integer
          example: 200
        client_id:
          type: string
        name:
          type: string
        created:
          type: string
          format: date-time
        server_version:
          type: string

    ApiResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          format: int32
          description: Status of API call
          enum:
            - 200
            - 400
        message:
          type: string
          description: Optional message about why the API call failed
