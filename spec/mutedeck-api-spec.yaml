openapi: 3.0.3
info:
  title: MuteDeck
  description: |-
    Take control of your meetings with MuteDeck
    Reduce meeting stress and mistakes. Never hear "hey, you're on mute" again.

    Check and control your Zoom, Microsoft Teams, Google Meet, Webex, and other calls; quickly mute or unmute, toggle your webcam, start sharing, quickly leave the meeting, and more.

    ## Authentication

    A token is optional. Send it as `Authorization: Bearer <token>`; when
    sent, it must be valid, or the request is answered with HTTP 401. A token
    also identifies the caller, so `source` isn't needed with one.

    Without a token, MuteDeck's "Plugins without authentication" setting
    (Settings > Plugins & API) decides: by default every request is allowed;
    with "this computer only", requests from other devices get 401; with
    "block", every request without a token gets 426.

    To get a token:
    - Scripts and tools: create one in MuteDeck Settings > Plugins & API.
    - Apps and plugins: `POST /v1/pair`, then poll `GET /v1/pair/{request_id}`
      until the user clicks Allow in MuteDeck. Older MuteDeck versions answer
      `/v1/pair` with 404; keep calling the API without a token there.

    Some useful links:
    - [mutedeck.com](https://mutedeck.com)
  contact:
    email: support@mutedeck.com
  version: 1.6.0
servers:
  - url: http://localhost:3491
security:
  - {}
  - bearerAuth: []
tags:
  - name: Pairing
    description: Get a token by approving this client in MuteDeck
  - name: Meeting Status
    description: Current state of your meeting
  - name: Meeting Controls
    description: Control your meeting
