  /v1/pair:
    post:
      tags:
        - Pairing
      summary: Ask the user to approve this client
      description: |-
        Shows an approval prompt in MuteDeck. Poll the returned request until
        it is approved, denied or expired (after 120 seconds). Rate-limited
        per IP address. Needs no token.
      operationId: requestPairing
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairRequest'
            example:
              client:
                id: raycast
                name: Raycast
                version: "1.3.0"
                host_app: raycast
                host_version: "1.84.2"
                os: mac
              instance_id: 1d1f8f4e-5f0a-4b5e-9c55-2f8f5a1d3c11
      responses:
        '202':
          description: Prompt shown or queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairPending'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '403':
          description: Denied recently for this client, or too many prompts queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairDenied'
        '429':
          description: Too many pairing requests from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /v1/pair/{request_id}:
    get:
      tags:
        - Pairing
      summary: Poll a pairing request
      description: |-
        Returns the token exactly once. After a 200 response the request is
        gone, and later polls get 404. Needs no token.
      operationId: pollPairing
      security: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairApproved'
        '202':
          description: Still waiting for the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairPending'
        '403':
          description: Denied or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairDenied'
        '404':
          description: Unknown or already collected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /v1/whoami:
    get:
      tags:
        - Pairing
      summary: Check a token
      description: Returns the client the token belongs to.
      operationId: whoami
      security:
        - bearerAuth: []
      responses:
        '200':
