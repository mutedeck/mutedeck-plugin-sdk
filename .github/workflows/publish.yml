name: Publish

# Push a tag like v1.0.0 to publish @mutedeck/plugin-client and
# @mutedeck/mock-server to npm, and MuteDeck.PluginClient to NuGet.
# Secrets: NPM_TOKEN (npm automation token), NUGET_USER (nuget.org profile
# name, for trusted publishing).
# The tag must match the version in the package files.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance, NuGet trusted publishing

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/js packages/mock-server; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "$pkg is $version, tag is $tag" >&2
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # mock-server first: plugin-client's tests depend on it
      - run: npm publish -w @mutedeck/mock-server --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish -w @mutedeck/plugin-client --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' packages/dotnet/src/MuteDeck.PluginClient/MuteDeck.PluginClient.csproj)
          if [ "$version" != "$tag" ]; then
            echo "MuteDeck.PluginClient is $version, tag is $tag" >&2
            exit 1
          fi
      - run: dotnet test packages/dotnet/MuteDeck.PluginClient.sln -c Release
      - run: dotnet pack packages/dotnet/src/MuteDeck.PluginClient -c Release -o out
      # Trusted publishing: exchange this run's OIDC token for an API key
      # that is valid for an hour. The nuget.org policy must name this
      # repository and the workflow file publish.yml.
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: mutedeck
      - run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
